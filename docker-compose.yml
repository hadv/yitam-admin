services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Point at the local qdrant service by default; override to target Qdrant Cloud.
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - COLLECTION_NAME=${COLLECTION_NAME:-knowledge_base}
      # Must match the Gemini embedding model's output size and the existing
      # collection's vector size. Changing this on a populated collection breaks upserts.
      - GEMINI_VECTOR_SIZE=${GEMINI_VECTOR_SIZE:-768}
      # Gemini is used for embeddings only (gemini-embedding-001).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Alibaba Cloud Model Studio (DashScope): Qwen text + vision generation (titles, summaries,
      # metadata, OCR correction, transcript cleaning / translation, board OCR, term correction)
      # and Alibaba ASR. Without it every generative step is silently skipped in the container.
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ALIBABA_ASR_BASE_URL=${ALIBABA_ASR_BASE_URL:-}
      - ALIBABA_LLM_ENABLED=${ALIBABA_LLM_ENABLED:-}
      - ALIBABA_LLM_BASE_URL=${ALIBABA_LLM_BASE_URL:-}
      - ALIBABA_LLM_FAST_MODEL=${ALIBABA_LLM_FAST_MODEL:-}
      - ALIBABA_LLM_QUALITY_MODEL=${ALIBABA_LLM_QUALITY_MODEL:-}
      - ALIBABA_LLM_VISION_MODEL=${ALIBABA_LLM_VISION_MODEL:-}
      - ALIBABA_LLM_TIMEOUT_MS=${ALIBABA_LLM_TIMEOUT_MS:-}
    depends_on:
      - qdrant
    volumes:
      - ./uploads:/app/uploads
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always 