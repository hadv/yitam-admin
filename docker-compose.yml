version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_ENABLE_FASTEMBED=true
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=documents
      - VECTOR_SIZE=384
    depends_on:
      - qdrant
    volumes:
      - ./uploads:/app/uploads
    restart: always

  memvid-service:
    build:
      context: ./memvid-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MemVid Service
      - APP_VERSION=1.0.0
      - DEBUG=true
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:5173"]
      - LOG_LEVEL=INFO
    volumes:
      - ./memvid-service/uploads:/app/uploads
      - ./memvid-service:/app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
      - memvid-service
    restart: always